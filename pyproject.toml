[project]
name = "moe"
version = "0.0.1"
authors = [{ name = "Robert Dyro" }, { name = "Gleb Pobudzey" }]
dependencies = ["jax", "numpy", "tqdm"]
description = "Efficient expert parallelism in MoE in JAX"
readme = "README.md"
license = { file = "LICENSE" }

[project.optional-dependencies]
test = ["absl-py", "pytest"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["moe"]

[tool.ruff]
preview = true
exclude = [
    ".git",
    "build",
    "__pycache__",
    "scratch",
]
line-length = 120
indent-width = 2
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "C408",  # Unnecessary collection call
    "C901",  # Object names too complex
    "F841",  # Local variable is assigned to but never used
    "B904",  # Raise with from clause inside except block
    "E111",  # ignore indentation not being 4 (we use 2)
    "E114",  # ignore indentation not being 4 in comments
    "E731",  # allow local lambdas
    "E741",  # allow ambiguous names
]
select = ["B9", "C", "F", "W", "YTT", "ASYNC", "E"]
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["W391", "E501"]
